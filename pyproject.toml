[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transcription-pipeline"
version = "0.1.0"
description = "Audio transcription pipeline: probe, normalize, chunk, transcribe, stitch."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pydantic-settings>=2.2",
    "typer>=0.12",
]

[project.optional-dependencies]
# The local ASR engine. Heavy (pulls CTranslate2 + model download at runtime),
# so it's opt-in. `pip install -e ".[whisper]"` to get a working CLI.
whisper = [
    "faster-whisper>=1.0",
]

# API layer, used once the api/ package lands.
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
transcribe = "transcription.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/transcription"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"